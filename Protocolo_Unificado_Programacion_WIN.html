:root{
  --black:#0F0908;--yellow:#FFC200;--orange:#FF5A0A;--orange2:#FF8C05;--orange-soft:#FF8A50;--white:#FFFFFF;
  --bg:#F7F6F4;--surface:#FFFFFF;--grey:#EFEFEF;--text:#1A1A1A;--muted:#5F5855;--line:#E6E2DE;
  --speech-bg:#FFF4CC;--speech-edge:#FFC200;--do-bg:#FFE9DE;--do-edge:#FF5A0A;
  --ph-bg:#FFFFFF;--ph-text:#B34000;--ph-line:#FFC200;--mark:#FFC200;
  --shadow:0 6px 0 rgba(0,0,0,.07);--shadow-soft:0 10px 30px rgba(15,9,8,.08);
  --radius-xl:28px;--radius-lg:22px;--radius:18px;--radius-sm:12px;
  --font:'Tommy Soft WIN',"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#131010;--surface:#1E1A18;--grey:#262120;--text:#F4F1EE;--muted:#B8B0AB;--line:#3A3330;
    --speech-bg:#2D2612;--do-bg:#2E1D15;--ph-bg:#3A2A14;--ph-text:#FFB27F;--shadow:0 6px 0 rgba(0,0,0,.35);--shadow-soft:0 10px 30px rgba(0,0,0,.4);color-scheme:dark}
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font);font-size:16px;line-height:1.55}
body{overflow-x:clip}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--orange);outline-offset:3px;border-radius:10px}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wrap{max-width:1240px;margin:0 auto;padding:0 24px}
.emo{font-family:"Segoe UI Emoji","Apple Color Emoji","Noto Color Emoji",sans-serif;font-weight:400}

/* ---------- Cabecera de marca (estilo boletín WIN) ---------- */
.brandbar{position:relative;background:var(--grey);overflow:hidden}
.brandbar .wrap{display:flex;align-items:center;justify-content:space-between;gap:14px;min-height:72px;position:relative;z-index:2}
.logo{border:0;background:none;padding:6px 4px;display:flex;align-items:center}
.logo img{height:34px;width:auto;display:block}
.brandbar .who{color:var(--white);font-weight:700;font-size:14px;text-align:right;line-height:1.25}
.brandbar .who small{display:block;font-weight:400;font-size:12.5px;opacity:.92}
.blob{position:absolute;top:10px;right:24px;width:min(520px,62vw);height:52px;border-radius:999px 26px 26px 999px;
  background:linear-gradient(120deg,var(--orange-soft) 0%,var(--orange) 55%);z-index:1}
.blob::before{content:"";position:absolute;right:42%;top:-6px;width:42%;height:64px;border-radius:999px;background:var(--orange-soft);opacity:.35}

/* ---------- Inicio ---------- */
.hero{position:relative;background:var(--grey);padding:22px 0 70px;border-radius:0 0 48px 48px}
.hello{display:inline-flex;align-items:center;gap:10px;font-weight:800;font-size:19px;margin:6px 0 14px}
.hello .arrow{color:var(--yellow);font-size:24px;line-height:1}
.hero h1{font-weight:800;font-size:clamp(30px,4.6vw,54px);line-height:1.04;letter-spacing:-.01em;margin:0;text-transform:uppercase;text-wrap:balance}
.hero h1 .l2{display:block;color:var(--orange)}
.hero p.lead{color:var(--muted);font-size:18px;margin:14px 0 0;max-width:60ch}
.home-main{margin-top:-46px;position:relative;z-index:3}
.searchcard{background:var(--surface);border-radius:var(--radius-lg);box-shadow:var(--shadow-soft);padding:18px 18px 12px}
.searchcard .q{font-weight:800;font-size:17px;margin:0 0 10px 4px}
.searchbox{position:relative}
.searchbox input{width:100%;padding:15px 48px 15px 52px;border-radius:999px;border:2px solid var(--line);background:var(--bg);font-size:16.5px}
.searchbox input::placeholder{color:#8A827E}
.searchbox input:focus{border-color:var(--orange);outline:none;background:var(--surface);box-shadow:0 0 0 5px rgba(255,90,10,.15)}
.searchbox svg{position:absolute;left:18px;top:50%;transform:translateY(-50%);width:20px;height:20px;color:var(--orange)}
.searchbox .clear{position:absolute;right:10px;top:50%;transform:translateY(-50%);border:0;background:var(--grey);width:32px;height:32px;border-radius:50%;font-size:18px;color:var(--muted);display:none}
.searchbox.has .clear{display:block}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px 4px;align-items:center}
.chips span{font-size:13px;color:var(--muted)}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 13px;font-size:13.5px;font-weight:700}
.chip:hover{border-color:var(--orange);color:var(--orange)}

.pick{font-weight:800;font-size:19px;margin:34px 4px 14px}
.channels{display:grid;grid-template-columns:1fr 1fr;gap:22px;margin:0 0 56px}
.chan{position:relative;text-align:left;border:0;border-radius:var(--radius-xl);padding:28px 30px 26px;min-height:260px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;box-shadow:var(--shadow);transition:transform .18s ease,box-shadow .18s ease}
.chan:hover{transform:translateY(-4px);box-shadow:0 12px 0 rgba(0,0,0,.08)}
.chan.voz{background:var(--black);color:var(--white)}
.chan.chat{background:var(--yellow);color:var(--black)}
.chan .icon{position:absolute;right:26px;top:24px;width:78px;height:78px;border-radius:26px;display:grid;place-items:center;font-size:40px;z-index:2}
.chan.voz .icon{background:linear-gradient(135deg,var(--orange2),var(--orange))}
.chan.chat .icon{background:var(--white)}
.chan .shape{position:absolute;right:-60px;bottom:-70px;width:260px;height:190px;border-radius:999px 999px 40px 999px;opacity:.16;background:currentColor;pointer-events:none}
.chan.voz .shape{background:var(--orange);opacity:.22}
.chan .word{font-weight:800;font-size:clamp(70px,9.5vw,118px);line-height:.88;letter-spacing:-.02em;position:relative;z-index:2}
.chan.voz .word{color:var(--orange)}
.chan .sub{display:inline-block;font-weight:800;font-size:15px;letter-spacing:.08em;margin-top:12px;padding:4px 12px;border-radius:999px;position:relative;z-index:2}
.chan.voz .sub{background:rgba(255,255,255,.12);color:var(--white)}
.chan.chat .sub{background:rgba(15,9,8,.1)}
.chan .desc{display:block;font-size:15.5px;margin-top:12px;max-width:30ch;position:relative;z-index:2;opacity:.92}
.chan .meta{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:20px;font-size:14.5px;position:relative;z-index:2}
.chan .go{display:inline-flex;align-items:center;gap:8px;font-weight:800;padding:11px 18px;border-radius:999px}
.chan.voz .go{background:var(--orange);color:var(--white)}
.chan.chat .go{background:var(--black);color:var(--yellow)}

/* ---------- Resultados ---------- */
.results{margin:22px 0 56px}
.results h2{font-size:15px;color:var(--muted);font-weight:700;margin:0 4px 12px}
.res{display:block;width:100%;text-align:left;background:var(--surface);border:2px solid transparent;border-radius:var(--radius);padding:14px 18px;margin:0 0 12px;box-shadow:var(--shadow)}
.res:hover{border-color:var(--orange)}
.res .tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.tag{font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px;background:var(--grey);color:var(--text)}
.tag.voz{background:var(--black);color:var(--white)}
.tag.chat{background:var(--yellow);color:var(--black)}
.res .t{font-weight:800;display:block;font-size:16px}
.res .snip{display:block;color:var(--muted);font-size:14px;margin-top:4px}
mark{background:var(--mark);color:#0F0908;border-radius:4px;padding:0 3px}
.empty{background:var(--surface);border:2px dashed var(--line);border-radius:var(--radius);padding:24px;color:var(--muted);display:flex;gap:14px;align-items:flex-start}
.empty .emo{font-size:26px;line-height:1}

/* ---------- Vista de canal ---------- */
.topbar{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--surface) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.topbar .wrap{display:flex;align-items:center;gap:12px;min-height:66px;flex-wrap:wrap;padding-top:9px;padding-bottom:9px}
.btn{display:inline-flex;align-items:center;gap:8px;border:2px solid var(--line);background:var(--surface);padding:8px 15px;border-radius:999px;font-weight:700;font-size:14px;min-height:42px}
.btn:hover{border-color:var(--orange);color:var(--orange)}
.btn svg{width:16px;height:16px}
.btn.home{background:var(--orange);border-color:var(--orange);color:var(--white)}
.btn.home:hover{background:#E84E05;color:var(--white)}
.switch{display:inline-flex;background:var(--grey);border-radius:999px;padding:4px}
.switch button{border:0;background:transparent;padding:8px 18px;border-radius:999px;font-weight:800;font-size:14px;min-height:36px;display:inline-flex;gap:6px;align-items:center}
.switch button[aria-pressed="true"].voz{background:var(--black);color:var(--white)}
.switch button[aria-pressed="true"].chat{background:var(--yellow);color:var(--black)}
.topbar .searchbox{flex:1 1 280px}
.topbar .searchbox input{padding:10px 40px 10px 44px;font-size:15px}
.topbar .searchbox svg{left:16px;width:18px;height:18px}
.scope{display:inline-flex;align-items:center;gap:7px;font-size:13.5px;color:var(--muted);white-space:nowrap;font-weight:700}
.scope input{accent-color:var(--orange);width:17px;height:17px}

.chhead{position:relative;overflow:hidden;padding:30px 0 26px;margin:16px 0 0}
.chhead .wrap{position:relative}
.chhead .band{position:relative;overflow:hidden;border-radius:var(--radius-xl);padding:26px 30px;display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap;box-shadow:var(--shadow)}
.chhead{padding:0;margin:20px 0 0}
.chhead.voz .band{background:var(--black);color:var(--white)}
.chhead.chat .band{background:var(--yellow);color:var(--black)}
.chhead .band::after{content:"";position:absolute;right:-50px;top:-60px;width:300px;height:170px;border-radius:999px 40px 999px 999px;opacity:.2;background:currentColor}
.chhead.voz .band::after{background:var(--orange);opacity:.3}
.chhead h1{font-weight:800;font-size:clamp(52px,7vw,84px);line-height:.88;letter-spacing:-.02em;margin:0;position:relative;z-index:1;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.chhead.voz h1{color:var(--orange)}
.chhead h1 .sub{font-size:16px;letter-spacing:.08em;padding:5px 14px;border-radius:999px}
.chhead.voz h1 .sub{background:rgba(255,255,255,.12);color:var(--white)}
.chhead.chat h1 .sub{background:rgba(15,9,8,.1);color:var(--black)}
.chhead .doc{font-size:15px;max-width:40ch;position:relative;z-index:1;display:flex;gap:10px;align-items:center}
.chhead .doc .emo{font-size:30px}

.layout{display:grid;grid-template-columns:290px 1fr;gap:30px;padding-top:26px;padding-bottom:64px;align-items:start}
.layout>*{min-width:0}
.sidenav{position:sticky;top:86px;background:var(--surface);border-radius:var(--radius-lg);padding:14px 12px;box-shadow:var(--shadow)}
.sidenav h2{font-size:14px;font-weight:800;margin:2px 0 10px 8px}
.sidenav ol{list-style:none;margin:0;padding:0;position:relative}
.sidenav li{margin:0 0 3px}
.sidenav button{position:relative;width:100%;display:flex;align-items:center;gap:11px;text-align:left;border:0;background:transparent;padding:9px 10px;border-radius:14px;font-size:15px;font-weight:700;color:var(--text);line-height:1.25}
.sidenav button:hover{background:var(--grey)}
.sidenav .num{flex:none;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:17px;background:var(--grey)}
.sidenav .lbl{flex:1}
.sidenav .cnt{font-size:12px;font-weight:800;min-width:26px;text-align:center;padding:2px 7px;border-radius:999px;background:var(--grey);color:var(--muted)}
.sidenav button[aria-current="true"]{background:var(--orange);color:var(--white)}
.sidenav button[aria-current="true"] .num{background:var(--white)}
.sidenav button[aria-current="true"] .cnt{background:rgba(255,255,255,.25);color:var(--white)}
.sidenav button.none:not([aria-current]){color:var(--muted)}

.sechead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:4px 0 18px}
.sechead .k{display:inline-flex;align-items:center;gap:8px;font-size:13.5px;color:var(--muted);font-weight:700}
.sechead .k b{background:var(--orange);color:var(--white);border-radius:999px;padding:1px 10px;font-size:12.5px}
.sechead h2{font-size:clamp(26px,3vw,34px);font-weight:800;margin:4px 0 0;display:flex;gap:10px;align-items:center}
.sechead .tools{display:flex;gap:8px;flex-wrap:wrap}
.secnav{display:flex;justify-content:space-between;gap:10px;margin-top:24px}

.case{background:var(--surface);border:2px solid transparent;border-radius:var(--radius);margin:0 0 14px;overflow:hidden;box-shadow:var(--shadow)}
.case:hover{border-color:var(--line)}
.case.open{border-color:var(--orange)}
.case.flash{animation:flash 1.4s ease}
@keyframes flash{0%,40%{box-shadow:0 0 0 5px var(--yellow)}100%{box-shadow:var(--shadow)}}
.case-h{width:100%;display:flex;align-items:center;gap:14px;border:0;background:transparent;text-align:left;padding:16px 18px}
.case-h .ref{flex:none;font-size:12px;font-weight:800;color:var(--orange);background:var(--do-bg);border-radius:999px;padding:4px 10px}
.case-h .title{flex:1;font-weight:700;font-size:16.5px;line-height:1.35}
.case-h .chev{flex:none;width:34px;height:34px;padding:7px;border-radius:50%;background:var(--grey);transition:transform .2s,background .2s}
.case.open .chev{transform:rotate(180deg);background:var(--orange);color:var(--white)}
.case-b{padding:0 18px 18px;display:none}
.case.open .case-b{display:block}
.meta-rows{display:grid;grid-template-columns:auto 1fr;gap:3px 12px;font-size:13.5px;margin:0 0 14px;padding:11px 14px;background:var(--grey);border-radius:var(--radius-sm)}
.meta-rows dt{font-weight:800}
.meta-rows dd{margin:0;color:var(--muted)}
.blocks{display:grid;grid-template-columns:minmax(0,3fr) minmax(0,2fr);gap:14px}
.blk{border-radius:var(--radius);padding:16px 18px 14px;position:relative}
.blk.say{background:var(--speech-bg);border-left:6px solid var(--speech-edge);border-radius:6px var(--radius) var(--radius) 6px}
.blk.do{background:var(--do-bg);border-left:6px solid var(--do-edge);border-radius:6px var(--radius) var(--radius) 6px}
.blk h3{display:flex;align-items:center;gap:10px;margin:0 0 12px;font-size:16px;font-weight:800}
.blk h3 .badge{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:17px}
.blk.say h3 .badge{background:var(--yellow)}
.blk.do h3 .badge{background:var(--orange)}
.blk h3 small{font-weight:400;font-size:13px;color:var(--muted);margin-left:2px}
.txt{font-size:15.5px;max-width:72ch}
.txt p{margin:0 0 .65em}
.txt p:last-child{margin-bottom:0}
.txt .sub{font-weight:800;margin-top:.9em;color:var(--orange)}
.blk.say .txt .sub{color:#A35A00}
.txt .sub:first-child{margin-top:0}
.txt ul{margin:0 0 .65em;padding-left:1.2em}
.txt li{margin:0 0 .3em}
.txt li::marker{color:var(--orange)}
.say .txt{font-size:16.5px}
.ph{background:var(--ph-bg);color:var(--ph-text);border-radius:6px;padding:0 4px;font-weight:700;box-shadow:inset 0 -2px 0 var(--ph-line)}
.none-txt{color:var(--muted);font-style:italic;font-size:14.5px;margin:0}
.blk .acts{display:flex;justify-content:flex-end;margin-top:12px}
.copy{display:inline-flex;align-items:center;gap:6px;border:0;border-radius:999px;padding:8px 14px;font-size:13.5px;font-weight:800;min-height:36px}
.blk.say .copy{background:var(--black);color:var(--yellow)}
.blk.do .copy{background:var(--orange);color:var(--white)}
.copy:hover{filter:brightness(1.1)}
.copy[disabled]{opacity:.4;cursor:not-allowed;filter:none}
.copy svg{width:15px;height:15px}
@media (prefers-color-scheme:dark){.blk.say .txt .sub{color:var(--yellow)}.blk.say .copy{background:var(--yellow);color:var(--black)}}
.case-f{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.note{font-size:12.5px;color:var(--muted);display:flex;gap:6px;align-items:flex-start;max-width:70ch;margin:0}
.note svg{flex:none;width:14px;height:14px;margin-top:3px}

.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(30px);background:var(--black);color:var(--white);padding:12px 20px;border-radius:999px;font-weight:700;font-size:14.5px;opacity:0;pointer-events:none;transition:all .2s;z-index:50;box-shadow:0 10px 26px rgba(0,0,0,.25)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast b{color:var(--yellow)}

/* ---------- Pie CFD ---------- */
footer{background:#000;color:#ddd;clip-path:polygon(0 26%,100% 0,100% 100%,0 100%);padding:44px 0 26px;margin-top:10px}
footer .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
footer .cfd{display:flex;align-items:center;gap:12px}
footer .cfd b{font-weight:800;font-size:30px;color:#fff;letter-spacing:.01em}
footer .cfd span{font-size:13px;font-weight:700;line-height:1.3}
footer .src{font-size:12.5px;color:#aaa;max-width:56ch;flex:1 1 300px}
footer .tag-int{background:var(--orange);color:#fff;font-weight:800;font-size:12px;padding:6px 14px;border-radius:6px;letter-spacing:.05em}

@media (max-width:1100px){.blocks{grid-template-columns:1fr}}
@media (max-width:860px){
  .wrap{padding:0 16px}
  .brandbar .who{display:none}
  .blob{width:46vw}
  .hero{border-radius:0 0 32px 32px;padding-bottom:62px}
  .channels{grid-template-columns:1fr}
  .chan{min-height:220px}
  .chan .icon{width:62px;height:62px;font-size:32px;border-radius:20px}
  .layout{grid-template-columns:1fr;gap:14px;padding-top:14px}
  .sidenav{position:sticky;top:var(--tb,120px);z-index:10;background:var(--bg);margin:0 -16px;padding:10px 16px;border-radius:0;box-shadow:none;border-bottom:1px solid var(--line)}
  .sidenav h2{display:none}
  .sidenav ol{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
  .sidenav ol::-webkit-scrollbar{display:none}
  .sidenav li{margin:0;flex:none}
  .sidenav button{white-space:nowrap;padding:6px 12px 6px 6px;background:var(--surface);border-radius:999px;font-size:14px;box-shadow:var(--shadow)}
  .sidenav .num{width:28px;height:28px;font-size:15px}
  .topbar .searchbox{order:5;flex-basis:100%}
  .scope{order:6}
  .chhead .band{padding:20px 22px}
  .case-h{padding:14px}
  .case-b{padding:0 14px 14px}
  .meta-rows{grid-template-columns:1fr}
  .meta-rows dd{margin-bottom:4px}
  footer{clip-path:polygon(0 12%,100% 0,100% 100%,0 100%)}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<script id="protocol-data" type="application/json">{"sections": ["Saludo", "Confirmación de motivo de llamada", "Derivación de llamada", "Agendamiento", "Situaciones propias de chat", "Despedida"], "cases": [{"id": "r3", "n": 1, "sec": 0, "caso": "Saludo, presentación del asesor y solicitud del nombre del cliente", "voz": {"digo": "1. Saludo:\nOpción 1. Bienvenido(a) a WIN.\nOpción 2. Gracias por llamar a WIN.\n\n2. Presentación del asesor:\nOpción 1. Mi nombre es (Nombre y Apellido).\nOpción 2. Te saluda (Nombre y Apellido).\n\n3. Solicitud del nombre del cliente:\nOpción 1. ¿Con quién tengo el gusto?\nOpción 2. ¿Con quién tengo el agrado de comunicarme?", "hago": "Saludar al cliente, presentarse y preguntar su nombre, utilizando una de las alternativas indicadas en cada paso."}, "chat": {"digo": "👋 ¡Hola! Buenos días/tardes/noches, (Nombre del cliente)! Bienvenido(a) a WIN.\n\nSoy (Nombre del asesor) y será un gusto ayudarte. 😊\n\nPara comenzar, ¿me confirmas tu nombre, por favor?", "hago": "Saludar al cliente, presentarse y preguntar su nombre."}}, {"id": "r4", "n": 2, "sec": 0, "caso": "Confirmación del número de documento en consulta", "voz": null, "chat": {"digo": "¡Gracias, (Nombre del cliente)! 😊 Para continuar, ¿me confirmas si eres el titular del servicio?", "hago": "Confirmar el número de documento en consulta."}}, {"id": "r5", "n": 3, "sec": 0, "caso": "Identificación del número telefónico cuando el chat no muestra el número (ID o nombre de usuario de WhatsApp)", "voz": null, "chat": {"digo": "(Nombre del cliente), por si el chat se interrumpe, queremos asegurarnos de poder contactarte. 📞 ¿Me podrías brindar tu número de celular, por favor?\n\nGracias. Te confirmo el número: (9XX XXX XXX). ¿Es correcto?", "hago": "Cuando el chat solo muestra ID o nombre de usuario (sin número visible), solicitar el número de celular antes de continuar, repetirlo para confirmarlo y registrarlo como número de contacto. Si no tiene 9 dígitos o no empieza con 9, volver a solicitarlo."}}, {"id": "r6", "n": 4, "sec": 1, "caso": "Confirmación de motivo de la llamada", "voz": {"digo": "Opción 1: (Cuéntame/Cuéntele), ¿en qué (te/le) puedo ayudar el día de hoy?\nOpción 2: ¿Cómo (te/le) puedo ayudar?", "hago": "Validar el motivo de la llamada; puedes parafrasear lo mencionado por el cliente."}, "chat": {"digo": "¡De acuerdo, (Nombre del cliente)! 😊 Es un gusto poder atenderte. Cuéntame, ¿cómo te puedo ayudar el día de hoy?\nCuéntame, ¿cómo te puedo ayudar el día de hoy?", "hago": "Consultar el motivo de la llamada."}}, {"id": "r7", "n": 5, "sec": 1, "caso": "a) Cliente sin facilidades técnicas consulta por el estado de su instalación", "voz": {"digo": "Sentimos no [haberte/haberlo(a)] llamado con anterioridad. (Te/Le) comento que, en esta oportunidad, no vamos a poder realizar la instalación del servicio porque [Explicar motivo]. (Disculpa/Disculpe) los inconvenientes ocasionados. Gracias por (tu/su) comprensión.", "hago": "Aplicar speech e indicar el motivo."}, "chat": {"digo": "(Nombre del cliente), sentimos no haberte contactado antes. 🙏 Te comento que, en esta oportunidad, no podremos realizar la instalación del servicio debido a (explicar motivo).\n\nLamentamos los inconvenientes ocasionados y agradecemos tu comprensión.", "hago": "Aplicar el speech e indicar el motivo."}}, {"id": "r8", "n": 6, "sec": 1, "caso": "a) Motivo: Edificio no habilitado", "voz": {"digo": "Necesitamos realizar un cableado por ductería para habilitar el Internet en el edificio.", "hago": "Aplica para Edificio no habilitado."}, "chat": {"digo": "(Nombre del cliente), actualmente necesitamos realizar un cableado por ductería para habilitar el servicio de Internet en tu edificio. 🔧", "hago": "Aplica para Edificio no habilitado."}}, {"id": "r9", "n": 7, "sec": 1, "caso": "a) Motivo: CTO o CAJA NAP saturada", "voz": {"digo": "La zona presenta saturación de clientes.", "hago": "Aplica para CTO o CAJA NAP saturada."}, "chat": {"digo": "(Nombre del cliente), actualmente la zona presenta saturación de clientes, por lo que no podremos realizar la instalación en este momento. 🙏", "hago": "Aplica para CTO o CAJA NAP saturada."}}, {"id": "r10", "n": 8, "sec": 1, "caso": "a) Motivo: Zona sin cobertura (sin cobertura WIN)", "voz": {"digo": "Por el momento, (tu/su) zona no cuenta con cobertura WIN.", "hago": "Aplica para Zona sin cobertura."}, "chat": {"digo": "(Nombre del cliente), por el momento tu zona no cuenta con cobertura WIN. 🙏", "hago": "Aplica para Zona sin cobertura."}}, {"id": "r11", "n": 9, "sec": 1, "caso": "a) Motivo: Zona sin cobertura (sin postes de apoyo)", "voz": {"digo": "La zona no cuenta con postes de apoyo.", "hago": "Aplica para Zona sin cobertura."}, "chat": {"digo": "(Nombre del cliente), actualmente la zona no cuenta con postes de apoyo necesarios para realizar la instalación. 🙏", "hago": "Aplica para Zona sin cobertura."}}, {"id": "r12", "n": 10, "sec": 1, "caso": "a) Motivo: Potencia degradada, entre otros", "voz": {"digo": "Por el momento, nuestra cobertura es limitada en (tu/su) zona.", "hago": "Aplica para Potencia degradada entre otros."}, "chat": {"digo": "(Nombre del cliente), por el momento nuestra cobertura es limitada en tu zona, por lo que no podremos realizar la instalación. 🙏", "hago": "Aplica para Potencia degradada y otros."}}, {"id": "r13", "n": 11, "sec": 1, "caso": "a) Speech por facilidades técnicas (flujo digital)", "voz": null, "chat": {"digo": "(Nombre del cliente), te comento que, lamentablemente y debido a facilidades técnicas, no será posible realizar la instalación del servicio en tu domicilio.\nNos estaremos poniendo en contacto contigo cuando se pueda efectuar con normalidad.", "hago": "Aplicar speech por facilidades técnicas."}}, {"id": "r14", "n": 12, "sec": 1, "caso": "b) Cliente afectado por limpieza de cableado aéreo", "voz": {"digo": "(Le/Te) comento que estamos renovando nuestra operativa de Instalaciones en [Indicar distrito], retirando los cables en desuso a favor del ornato del distrito y descontaminación ambiental. Queremos asegurar(te/le) que comprendemos la importancia de esta instalación. Por lo cual, nos comprometemos a mantenernos en contacto para coordinar una nueva programación que se ajuste a (tu/su) disponibilidad.", "hago": "Haz clic para agendar."}, "chat": {"digo": "(Nombre del cliente), actualmente estamos renovando nuestra operativa de instalaciones en tu distrito, retirando cables en desuso para mantener la zona más ordenada y contribuir con el cuidado del ambiente. 🌱\n\nSabemos lo importante que es para ti contar con tu servicio, por eso nos mantendremos en contacto para coordinar una nueva programación. 📅", "hago": ""}}, {"id": "r15", "n": 13, "sec": 1, "caso": "c) Cliente solicita reprogramación", "voz": {"digo": "En caso el cliente no mencione el motivo de la reprogramación:\nNo hay problema. ¿Cuál es el motivo de la reprogramación?", "hago": "Haz clic para agendar."}, "chat": {"digo": "¡De acuerdo, (Nombre del cliente)! 😊 Para ayudarte con la reprogramación, ¿me podrías comentar cuál es el motivo?\n\nPerfecto. 📅 ¿Para qué día y en qué horario te gustaría que reprogramemos la instalación?", "hago": "Consultar el motivo de reprogramación."}}, {"id": "r16", "n": 14, "sec": 1, "caso": "c) Cliente solicita reprogramación: mayores a 30 días", "voz": {"digo": "(Te/Le) comentamos que el tiempo máximo de reprogramación es de 30 días. Por lo cual, (te/le) sugerimos agendarlo entre [indicar rango de días].", "hago": ""}, "chat": {"digo": "Entiendo, (Nombre del cliente). 😊 Te comento que el plazo máximo permitido para reprogramar la instalación es de 30 días.\n\nPor ello, te sugiero agendarla entre (indicar rango de días). 📅\n\nEntiendo. Te comento que el plazo máximo permitido para reprogramar la instalación es de 30 días.", "hago": "Brindar speech sobre plazo máximo de reprogramación."}}, {"id": "r17", "n": 15, "sec": 1, "caso": "d) Cliente solicita estatus de programación: alta aprobada sin programación", "voz": {"digo": "Sentimos no [haberte/haberlo(a)] llamado con anterioridad. En este momento, vamos a programar la instalación de (tu/su) servicio.", "hago": "Haz clic para agendar."}, "chat": {"digo": "(Nombre del cliente), disculpa que no te hayamos contactado antes. 🙏 No te preocupes, voy a ayudarte con la programación de tu instalación. 📅", "hago": ""}}, {"id": "r18", "n": 16, "sec": 1, "caso": "d) Estatus: alta pendiente de aprobación", "voz": {"digo": "En estos momentos, nos encontramos procesando (tu/su) solicitud de servicio. En un plazo de 72 Hrs, nos comunicaremos (contigo/con usted) para agendar la instalación. Gracias por (tu/su) comprensión.", "hago": "Terminar la llamada."}, "chat": {"digo": "(Nombre del cliente), en este momento estamos procesando tu solicitud de servicio. 😊\n\nEn un plazo de hasta 72 horas nos comunicaremos contigo para agendar la instalación. Te pedimos estar atento(a) a tu teléfono registrado. 📞", "hago": ""}}, {"id": "r19", "n": 17, "sec": 1, "caso": "d) Estatus: alta desaprobada subsanable", "voz": {"digo": "Sentimos no [haberte/haberlo(a)] llamado con anterioridad. (Te/Le) comento que, en esta oportunidad, no hemos podido continuar con (tu/su) solicitud debido a [Indicar motivo subsanable]. Por favor, (comunícate/comuníquese) nuevamente a nuestro canal de ventas para regularizar los datos y grabar nuevamente el contrato de voz. Muchas gracias.", "hago": "Motivos: \n\n- Corte de llamada en la grabación del contrato: \"la llamada se cortó durante la grabación del contrato\".\n- DNI no legible: \"el documento de identidad no se pudo leer con claridad\".\n- Error de dirección: \"la dirección registrada presenta un error\"."}, "chat": {"digo": "(Nombre del cliente), disculpa que no te hayamos contactado antes. 🙏 Hemos identificado un inconveniente con la información registrada: (indicar motivo).\n\nNo te preocupes, el equipo de Ventas se comunicará contigo para ayudarte a subsanar la información y continuar con el proceso de instalación. 📞", "hago": "Motivos: \n\n- Corte de llamada en la grabación del contrato: \"la llamada se cortó durante la grabación del contrato\".\n- DNI no legible: \"el documento de identidad no se pudo leer con claridad\".\n- Error de dirección: \"la dirección registrada presenta un error\"."}}, {"id": "r20", "n": 18, "sec": 1, "caso": "d) Estatus: alta desaprobada no subsanable", "voz": {"digo": "Sentimos no [haberte/haberlo(a)] llamado con anterioridad. (Te/Le) comento que, en esta oportunidad, no vamos a poder realizar la instalación del servicio. Hemos validado que (tu/su) zona cuenta con cobertura. Sin embargo, (presenta saturación de clientes/no presenta las facilidades técnicas), lo cual nos impide garantizar una experiencia óptima. (Disculpa/Disculpe) los inconvenientes ocasionados. Gracias por (tu/su) comprensión.", "hago": "Aplicar para posible fraude.\nTerminar la llamada."}, "chat": {"digo": "Hola, (nombre del cliente). Lamentamos no haberte contactado antes. Te informamos que, por el momento, no podremos instalar tu servicio. Aunque tu zona tiene cobertura, (presenta saturación de clientes / no cuenta con las facilidades técnicas), y esto nos impide garantizarte una experiencia óptima. Disculpa los inconvenientes y gracias por tu comprensión. 🙏", "hago": ""}}, {"id": "r21", "n": 19, "sec": 1, "caso": "d) Estatus: alta desaprobada por Score", "voz": {"digo": "Sentimos no [haberte/haberlo(a)] llamado con anterioridad. (Te/Le) comento que, tras evaluar (tu/su) solicitud, no es posible continuar con la instalación de (tu/su) servicio en esta oportunidad. (Disculpa/Disculpe) los inconvenientes ocasionados y gracias por (tu/su) comprensión.", "hago": "Explicar con empatía que la solicitud no fue aprobada NO decir que fue por evaluación crediticia (Score). Indicar que podrá solicitar una reevaluación más adelante. NO agendar ni transferir a Ventas. Tipificar como 'Desaprobado por Score' y finalizar llamada."}, "chat": {"digo": "Hola, (Nombre del cliente). Lamentamos no haberte contactado antes. 🙏 Te informamos que, tras la evaluación de tu solicitud, no es posible proceder con la instalación de tu servicio en este momento. Disculpa los inconvenientes ocasionados y agradecemos mucho tu comprensión.", "hago": "Explicar con empatía que la solicitud no fue aprobada NO decir que fue por evaluación crediticia (Score). Indicar que podrá solicitar una reevaluación más adelante. NO agendar ni transferir a Ventas. Tipificar como 'Desaprobado por Score' y finalizar llamada"}}, {"id": "r22", "n": 20, "sec": 1, "caso": "d) Estatus: alta programada dentro de fecha y horario", "voz": {"digo": "(Te/Le) comentamos que (tu/su) instalación está programada para el día [Indicar día] en el horario de [Indicar rango horario].", "hago": "Terminar la llamada."}, "chat": {"digo": "¡Buenas noticias, (Nombre del cliente)! 😊 Tu instalación está programada para el día (indicar), en el rango de (indicar). 📅\n\nNuestro equipo técnico estará en tu domicilio dentro del horario acordado.", "hago": "Brindar speech correspondiente."}}, {"id": "r23", "n": 21, "sec": 1, "caso": "d) Estatus: alta programada con tramo incumplido o inasistencia del técnico", "voz": {"digo": "Vamos a escalar (tu/su) caso con el área correspondiente, por favor espere un momento en línea [Esperar respuesta de Instalaciones por 3 min. De lo contrario, aplicar speech de Reprogramación].", "hago": "Haz clic para agendar."}, "chat": {"digo": "Vamos a escalar (tu/su) caso con el área correspondiente, por favor espere un momento en línea [Esperar respuesta de Instalaciones por 3 min. De lo contrario, aplicar speech de Reprogramación].", "hago": ""}}, {"id": "r24", "n": 22, "sec": 1, "caso": "d) Estatus: alta programada que NO está dentro de fecha y horario", "voz": {"digo": "Sentimos profundamente los inconvenientes ocasionados.\n\nSi los técnicos están en camino:\nEn este momento, nuestros técnicos se encuentran en camino a (tu/su) domicilio. Por favor, (coméntame/coménteme), si podrá(s) recibirnos en aproximadamente XX minutos.\n\nRellamada si los técnicos están en camino:\nSentimos los inconvenientes ocasionados, ese no es el estándar de atención que queremos brindarle a nuestros clientes. Por favor, (permíteme/permítame) un momento para consultar el estado de (tu/su) visita.\n[Brindar información de SGI].\n\nSi amerita reprogramación:\nPor favor, permítenos reprogramar la visita en una nueva fecha y rango horario que se ajuste a (tu/su) disponibilidad.", "hago": "Haz clic para agendar.\n\nAvisar al Supervisor para reportar por Grupal de WhatsApp Progra IN-SGI."}, "chat": {"digo": "(Nombre del cliente), validamos que nuestro equipo técnico no llegó en el día y hora programados. 🙏 Te pedimos disculpas por los inconvenientes ocasionados.\n\nSi técnicos están en camino:\nTe comento que en este momento nuestro equipo técnico se encuentra en camino a tu domicilio. 📍 ¿Podrás recibirnos en aproximadamente XX minutos?\n\nSi ya están cerca/en camino:\n(Nombre del cliente), los técnicos ya están en camino a tu domicilio. 📍 Te pido por favor estar atento(a) a su llegada. ¿De acuerdo?\n\nSi necesita reprogramación:\nNo te preocupes, (Nombre del cliente). 😊 Voy a ayudarte a reprogramar tu instalación y coordinar una nueva fecha que se ajuste a tu disponibilidad. 📅 ¿Qué día y rango de horario te acomodan mejor?", "hago": "Haz clic para agendar.\n\nAvisar al Supervisor para reportar por Grupal de WhatsApp Progra IN-SGI."}}, {"id": "r25", "n": 23, "sec": 1, "caso": "d) Estatus: alta en rescate dentro de las 72 hrs", "voz": {"digo": "(Te/Le) comentamos que, en un periodo no mayor a 3 días calendarios, nuestro equipo especializado de ventas se comunicará (contigo/con usted) para regularizar (tu/su) solicitud del servicio.", "hago": "Terminar la llamada."}, "chat": {"digo": "(Nombre del cliente), te comento que es necesario subsanar cierta información de tu contrato. 📝\n\nNo te preocupes, el equipo de Ventas se comunicará contigo en un plazo no mayor a 72 horas para ayudarte con la regularización. 📞\n\nTe pedimos estar atento(a) a tu teléfono registrado. ¿De acuerdo?", "hago": ""}}, {"id": "r26", "n": 24, "sec": 1, "caso": "d) Estatus: cliente que reside en las Zonas Sur 1 a la 7", "voz": {"digo": "(Nombre del cliente), necesitamos actualizar algunos datos de (tu/su) perfil. No (te/se) preocupe(s), en breve recibirá(s) una llamada de un asesor de ventas para completar el proceso.", "hago": "Proceder con la actualización y alertar al supervisor de turno."}, "chat": {"digo": "(Nombre del cliente), necesitamos actualizar algunos datos de tu perfil. 📝\n\nNo te preocupes, el equipo de Ventas se comunicará contigo para ayudarte a subsanar la información y completar el proceso. 📞\n\nTe pedimos estar atento(a) a tu teléfono registrado. ¿De acuerdo?", "hago": "Proceder con la actualización y alertar al supervisor de turno."}}, {"id": "r27", "n": 25, "sec": 1, "caso": "d) Estatus: alta en rescate fuera de las 72 hrs", "voz": {"digo": "Sentimos no [haberte/haberlo(a)] llamado con anterioridad. (Te/Le) comento que el área Comercial se comunicará (contigo/con usted) para ayudarte con tu solicitud. Por favor, (mantente/manténgase) atento(a) a tu teléfono registrado. Gracias por (tu/su) comprensión.", "hago": "Terminar la llamada."}, "chat": {"digo": "Sentimos no [haberte/haberlo(a)] llamado con anterioridad. (Te/Le) comento que el área Comercial se comunicará (contigo/con usted) para ayudarte con tu solicitud. Por favor, (mantente/manténgase) atento(a) a tu teléfono registrado. Gracias por (tu/su) comprensión.", "hago": ""}}, {"id": "r28", "n": 26, "sec": 1, "caso": "d) Estatus: alta en rescate fuera de las 72 hrs con solicitud desaprobada o cancelada (no puede comunicarse por la opción 3)", "voz": {"digo": "Sentimos no [haberte/haberlo(a)] llamado con anterioridad. (Te/Le) informamos que (tu/su) solicitud se encuentra en estado [desaprobada / cancelada], por lo que en esta oportunidad no es factible continuar con el proceso de instalación ni transferir la llama const SEC_ICON = ['👋','💡','🔀','📅','💬','🙌'];
const app = document.getElementById('app');
const state = {view:'home', ch:'voz', sec:0, q:'', homeQ:'', allScope:false, open:new Set()};

/* ---------- Utilidades ---------- */
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function foldMap(str){ // normaliza (sin tildes, minúsculas) conservando el índice original
  let out='', idx=[];
  for(let i=0;i<str.length;i++){
    const f = str[i].normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
    for(const ch of f){ out+=ch; idx.push(i); }
  }
  return {out, idx};
}
const fold = s => foldMap(s).out;
const icons = {
  search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11 12 4l9 7"/><path d="M5 10v10h14V10"/></svg>',
  chev:'<svg class="chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>',
  say:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H9l-5 4z"/></svg>',
  do:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5a1 1 0 0 1 1-1h11"/></svg>',
  copy:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="11" height="11" rx="2"/><path d="M5 15V5a1 1 0 0 1 1-1h10"/></svg>',
  info:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>',
  expand:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 15 5 5 5-5M7 9l5-5 5 5"/></svg>',
  collapse:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m7 20 5-5 5 5M7 4l5 5 5-5"/></svg>'
};

/* Resalta marcadores para completar: [ ... ] y ( ... ) con alternativas o datos a reemplazar */
const PH_RE = /(\[[^\]\n]{1,90}\]|\((?:[^()\n]{0,60}\/[^()\n]{0,60}|[Nn]ombre[^()\n]{0,40}|[Ii]ndicar[^()\n]{0,40}|[Ee]xplicar[^()\n]{0,40}|9XX[^()\n]{0,20})\))/g;
function inline(line, phs){
  const e = esc(line);
  return phs ? e.replace(PH_RE, '<span class="ph">$1</span>') : e;
}
/* Formatea respetando saltos de línea: subtítulos (líneas que terminan en ":"), viñetas y párrafos */
function formatText(raw, phs){
  const blocks = raw.split(/\n\s*\n/);
  let html='';
  for(const b of blocks){
    const lines = b.split('\n');
    let list=[];
    const flush=()=>{ if(list.length){ html+='<ul>'+list.map(l=>'<li>'+inline(l,phs)+'</li>').join('')+'</ul>'; list=[]; } };
    for(const ln of lines){
      const t = ln.trim(); if(!t) continue;
      const m = t.match(/^[-•]\s+(.*)$/);
      if(m){ list.push(m[1]); continue; }
      flush();
      const isSub = /:$/.test(t) && t.length < 110 && !/[?¿]/.test(t);
      html += '<p'+(isSub?' class="sub"':'')+'>'+inline(t,phs)+'</p>';
    }
    flush();
  }
  return html;
}

function casesFor(ch){ return DATA.cases.filter(c => c[ch]); }
function bySection(ch, s){ return DATA.cases.filter(c => c[ch] && c.sec === s); }

/* ---------- Búsqueda ---------- */
function searchCases(q, channels, secFilter){
  const terms = fold(q).split(/\s+/).filter(Boolean);
  if(!terms.length) return [];
  const out=[];
  for(const ch of channels){
    for(const c of DATA.cases){
      const d = c[ch]; if(!d) continue;
      if(secFilter!=null && c.sec!==secFilter) continue;
      const fields = [['Caso',c.caso],['Sección',SECTIONS[c.sec]],['¿Qué digo?',d.digo],['¿Qué hago?',d.hago]];
      const hay = fields.map(f=>fold(f[1]||'')).join(' \u0001 ');
      if(!terms.every(t=>hay.includes(t))) continue;
      // fragmento: primer campo de contenido con coincidencia
      let snip='', where='';
      for(const [label,val] of fields){
        if(!val) continue;
        const fm = foldMap(val); const p = fm.out.indexOf(terms[0]);
        if(p>=0){
          const s0 = fm.idx[p], s1 = fm.idx[p+terms[0].length-1]+1;
          const a = Math.max(0,s0-60), z = Math.min(val.length,s1+90);
          snip = (a>0?'…':'')+esc(val.slice(a,s0)).replace(/\n+/g,' ')+'<mark>'+esc(val.slice(s0,s1))+'</mark>'+esc(val.slice(s1,z)).replace(/\n+/g,' ')+(z<val.length?'…':'');
          where = label; break;
        }
      }
      if(!snip){ snip = esc(d.digo.slice(0,140)).replace(/\n+/g,' ')+'…'; where='¿Qué digo?'; }
      out.push({c,ch,snip,where});
    }
  }
  return out;
}
function highlightTitle(text,q){
  const terms = fold(q).split(/\s+/).filter(Boolean); if(!terms.length) return esc(text);
  const fm = foldMap(text); const marks = new Array(text.length).fill(false);
  for(const t of terms){ let p=fm.out.indexOf(t); while(p>=0){ for(let k=p;k<p+t.length;k++) marks[fm.idx[k]]=true; p=fm.out.indexOf(t,p+1);} }
  let h='',on=false;
  for(let i=0;i<text.length;i++){ if(marks[i]&&!on){h+='<mark>';on=true;} if(!marks[i]&&on){h+='</mark>';on=false;} h+=esc(text[i]); }
  return h+(on?'</mark>':'');
}
function resultsHTML(list,q,showChannel){
  if(!list.length) return '<div class="empty" role="status"><span class="emo" aria-hidden="true">🔎</span><span>No encontramos coincidencias para “'+esc(q)+'”. Prueba con otra palabra, por ejemplo: reprogramación, reembolso, cobertura o despedida.</span></div>';
  return '<h2 role="status">'+list.length+' resultado'+(list.length>1?'s':'')+' para “'+esc(q)+'”</h2>'+list.map(r=>
    '<button class="res" data-open="'+r.ch+'|'+r.c.sec+'|'+r.c.id+'">'+
      '<span class="tags">'+(showChannel?'<span class="tag '+r.ch+'">'+(r.ch==='voz'?'VOZ · CALL IN':'CHAT · ATENCIÓN DIGITAL')+'</span>':'')+
      '<span class="tag">'+esc(SECTIONS[r.c.sec])+'</span><span class="tag">Coincidencia en: '+esc(r.where)+'</span></span>'+
      '<span class="t">'+highlightTitle(r.c.caso,q)+'</span><span class="snip">'+r.snip+'</span></button>').join('');
}

/* ---------- Vistas ---------- */
function renderHome(){
  document.title='Protocolo unificado de programación y cierre de programación | WIN';
  const nv=casesFor('voz').length, nc=casesFor('chat').length;
  app.innerHTML =
  '<section class="hero"><div class="wrap">'+
    '<h1>Protocolo unificado de programación<span class="l2">y cierre de programación</span></h1>'+
    '<p class="lead">Material de consulta para asesores de atención al cliente. Encuentra en segundos qué decir y qué hacer en cada situación.</p>'+
  '</div></section>'+
  '<div class="wrap home-main">'+
    '<div class="searchcard"><p class="q">¿Qué situación estás atendiendo?</p>'+
    '<div class="searchbox" id="homeSB"><label class="sr-only" for="homeQ">Buscar en VOZ y CHAT</label>'+icons.search+
      '<input id="homeQ" type="search" autocomplete="off" placeholder="Escribe una palabra: reprogramación, reembolso, cobertura…">'+
      '<button class="clear" type="button" aria-label="Borrar búsqueda">×</button></div>'+
    '<div class="chips"><span>Búsquedas rápidas:</span>'+['Reprogramación','Reembolso','Cobertura','Cancelación','Dirección','Despedida'].map(w=>'<button class="chip" data-chip="'+w+'">'+w+'</button>').join('')+'</div>'+
    '</div>'+
    '<div id="homeBody"></div>'+
  '</div>';
  const inp=document.getElementById('homeQ'), sb=document.getElementById('homeSB'), body=document.getElementById('homeBody');
  const tiles = '<p class="pick">Elige tu canal de atención</p>'+
    '<div class="channels">'+
      '<button class="chan voz" data-go="voz"><span class="shape"></span><span class="icon emo" aria-hidden="true">🎧</span><span><span class="word">VOZ</span><br><span class="sub">CALL IN</span><span class="desc">Speech y pasos para atender llamadas.</span></span>'+
        '<span class="meta"><span>'+nv+' casos · '+SECTIONS.length+' secciones</span><span class="go">Entrar a VOZ</span></span></button>'+
      '<button class="chan chat" data-go="chat"><span class="shape"></span><span class="icon emo" aria-hidden="true">💬</span><span><span class="word">CHAT</span><br><span class="sub">ATENCIÓN DIGITAL</span><span class="desc">Speech y pasos para atender por chat.</span></span>'+
        '<span class="meta"><span>'+nc+' casos · '+SECTIONS.length+' secciones</span><span class="go">Entrar a CHAT</span></span></button>'+
    '</div>';
  const paint=()=>{
    const q=inp.value.trim(); state.homeQ=inp.value; sb.classList.toggle('has',!!inp.value);
    body.innerHTML = q ? '<div class="results">'+resultsHTML(searchCases(q,['voz','chat'],null),q,true)+'</div>' : tiles;
  };
  inp.value=state.homeQ; paint();
  inp.addEventListener('input',paint);
  sb.querySelector('.clear').addEventListener('click',()=>{inp.value='';paint();inp.focus();});
  app.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{inp.value=c.dataset.chip;paint();inp.focus();}));
}

function caseHTML(c,ch,q){
  const d=c[ch], open=state.open.has(ch+c.id);
  const say = formatText(d.digo,true);
  const doo = d.hago ? formatText(d.hago,false) : '<p class="none-txt">Sin indicación registrada en el protocolo para este caso.</p>';
  const note = (c.notes && c.notes[ch]) ? '<p class="note">'+icons.info+'<span>'+esc(c.notes[ch])+'</span></p>' : '<span></span>';
  return '<article class="case'+(open?' open':'')+'" id="'+ch+'-'+c.id+'" data-id="'+c.id+'">'+
    '<button class="case-h" aria-expanded="'+open+'" aria-controls="b-'+ch+'-'+c.id+'">'+
      '<span class="ref" title="Número de fila del protocolo">N.º '+esc(c.n)+'</span>'+
      '<span class="title">'+(q?highlightTitle(c.caso,q):esc(c.caso))+'</span>'+icons.chev+'</button>'+
    '<div class="case-b" id="b-'+ch+'-'+c.id+'">'+
      '<dl class="meta-rows"><dt>SECCIÓN:</dt><dd>'+esc(SECTIONS[c.sec])+'</dd><dt>CASO O SITUACIÓN:</dt><dd>'+esc(c.caso)+'</dd></dl>'+
      '<div class="blocks">'+
        '<section class="blk say" aria-label="¿Qué digo?"><h3><span class="badge emo" aria-hidden="true">🗣️</span>¿QUÉ DIGO?</h3><div class="txt">'+say+'</div>'+
          '<div class="acts"><button class="copy" data-copy="say">'+icons.copy+'Copiar speech</button></div></section>'+
        '<section class="blk do" aria-label="¿Qué hago?"><h3><span class="badge emo" aria-hidden="true">✅</span>¿QUÉ HAGO?</h3><div class="txt">'+doo+'</div>'+
          '<div class="acts"><button class="copy" data-copy="do"'+(d.hago?'':' disabled title="No hay procedimiento registrado"')+'>'+icons.copy+'Copiar procedimiento</button></div></section>'+
      '</div>'+
      '<div class="case-f">'+note+'<button class="btn" data-copy="all">'+icons.copy+'Copiar contenido completo</button></div>'+
    '</div></article>';
}

function renderChannel(focusId){
  const ch=state.ch, C=CH[ch];
  document.title=C.title+' – '+C.sub+' | Protocolo unificado WIN';
  const counts = SECTIONS.map((_,i)=>bySection(ch,i).length);
  app.innerHTML =
  '<div class="topbar"><div class="wrap">'+
    '<button class="btn home" id="goHome">'+icons.home+'Inicio</button>'+
    '<div class="switch" role="group" aria-label="Cambiar de canal">'+
      '<button class="voz" aria-pressed="'+(ch==='voz')+'" data-ch="voz"><span class="emo" aria-hidden="true">🎧</span>VOZ</button>'+
      '<button class="chat" aria-pressed="'+(ch==='chat')+'" data-ch="chat">CHAT</button></div>'+
    '<div class="searchbox" id="chSB"><label class="sr-only" for="chQ">Buscar en '+C.title+'</label>'+icons.search+
      '<input id="chQ" type="search" autocomplete="off" placeholder="Buscar en esta sección…">'+
      '<button class="clear" type="button" aria-label="Borrar búsqueda">×</button></div>'+
    '<label class="scope"><input type="checkbox" id="scopeAll"'+(state.allScope?' checked':'')+'> Buscar en todo '+C.title+'</label>'+
  '</div></div>'+
  '<header class="chhead '+ch+'"><div class="wrap"><div class="band"><h1>'+C.title+'<span class="sub">'+C.sub+'</span></h1>'+
    '<span class="doc"><span class="emo" aria-hidden="true">'+(ch==='voz'?'🎧':'💬')+'</span>Protocolo unificado de programación y cierre de programación</span></div></div></header>'+
  '<div class="wrap layout">'+
    '<nav class="sidenav" aria-label="Secciones de '+C.title+'"><h2>Secciones del protocolo</h2><ol>'+
      SECTIONS.map((s,i)=>'<li><button data-sec="'+i+'" class="'+(counts[i]?'':'none')+'"'+(i===state.sec?' aria-current="true"':'')+'>'+
        '<span class="num emo" aria-hidden="true">'+SEC_ICON[i]+'</span><span class="lbl"><span class="sr-only">'+(i+1)+'. </span>'+esc(s)+'</span><span class="cnt" aria-label="'+counts[i]+' casos">'+counts[i]+'</span></button></li>').join('')+
    '</ol></nav>'+
    '<div id="secBody" aria-live="polite"></div>'+
  '</div>';
  const tb=app.querySelector('.topbar'); document.documentElement.style.setProperty('--tb',(tb.offsetHeight)+'px');
  const inp=document.getElementById('chQ'), sb=document.getElementById('chSB');
  inp.value=state.q; sb.classList.toggle('has',!!state.q);
  const upd=()=>{ state.q=inp.value; sb.classList.toggle('has',!!inp.value); paintSection(); };
  inp.addEventListener('input',upd);
  sb.querySelector('.clear').addEventListener('click',()=>{inp.value='';upd();inp.focus();});
  document.getElementById('scopeAll').addEventListener('change',e=>{state.allScope=e.target.checked; inp.placeholder=state.allScope?'Buscar en todo '+C.title+'…':'Buscar en esta sección…'; paintSection();});
  inp.placeholder=state.allScope?'Buscar en todo '+C.title+'…':'Buscar en esta sección…';
  paintSection(focusId);
}

function paintSection(focusId){
  const ch=state.ch, s=state.sec, q=state.q.trim(), body=document.getElementById('secBody');
  if(q && state.allScope){
    body.innerHTML='<div class="sechead"><div><span class="k">Búsqueda en todo '+CH[ch].title+'</span><h2>Resultados</h2></div></div><div class="results" style="margin-top:0">'+resultsHTML(searchCases(q,[ch],null),q,false)+'</div>';
    return;
  }
  let list = bySection(ch,s);
  if(q){ const ids=new Set(searchCases(q,[ch],s).map(r=>r.c.id)); list=list.filter(c=>ids.has(c.id)); }
  const total = bySection(ch,s).length;
  let html='<div class="sechead"><div><span class="k"><b>Sección '+(s+1)+' de '+SECTIONS.length+'</b>'+total+' caso'+(total===1?'':'s')+'</span><h2><span class="emo" aria-hidden="true">'+SEC_ICON[s]+'</span>'+esc(SECTIONS[s])+'</h2></div>'+
    (total?'<div class="tools"><button class="btn" data-all="open">'+icons.expand+'Expandir todo</button><button class="btn" data-all="close">'+icons.collapse+'Contraer todo</button></div>':'')+'</div>';
  if(!total) html+='<div class="empty"><span class="emo" aria-hidden="true">📭</span><span>No se encontraron casos registrados para esta sección.</span></div>';
  else if(!list.length) html+='<div class="empty" role="status"><span class="emo" aria-hidden="true">🔎</span><span>No encontramos “'+esc(q)+'” en esta sección. Marca “Buscar en todo '+CH[ch].title+'” para ampliar la búsqueda.</span></div>';
  else html+=list.map(c=>caseHTML(c,ch,q)).join('');
  html+='<nav class="secnav" aria-label="Navegación entre secciones">'+
    (s>0?'<button class="btn" data-sec="'+(s-1)+'">‹ '+esc(SECTIONS[s-1])+'</button>':'<span></span>')+
    (s<SECTIONS.length-1?'<button class="btn" data-sec="'+(s+1)+'">'+esc(SECTIONS[s+1])+' ›</button>':'<span></span>')+'</nav>';
  body.innerHTML=html;
  app.querySelectorAll('.sidenav button').forEach(b=>{ if(+b.dataset.sec===s) b.setAttribute('aria-current','true'); else b.removeAttribute('aria-current'); });
  const cur=app.querySelector('.sidenav button[aria-current]'); if(cur && cur.scrollIntoView && window.innerWidth<=860) cur.scrollIntoView({block:'nearest',inline:'center'});
  if(focusId){
    const el=document.getElementById(ch+'-'+focusId);
    if(el){ const y=el.getBoundingClientRect().top+window.scrollY-(app.querySelector('.topbar').offsetHeight+(window.innerWidth<=860?64:16));
      window.scrollTo({top:y}); el.classList.add('flash'); el.querySelector('.case-h').focus({preventScroll:true}); }
  }
}

/* ---------- Copiar ---------- */
function toast(msg){ const t=document.getElementById('toast'); t.innerHTML=msg; t.classList.add('show'); clearTimeout(toast.t); toast.t=setTimeout(()=>t.classList.remove('show'),1800); }
function copyText(text,label){
  const done=()=>toast('<b>¡Listo!</b> '+label+' copiado <span class="emo">👍</span>');
  const fallback=()=>{ const ta=document.createElement('textarea'); ta.value=text; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0'; document.body.appendChild(ta); ta.select();
    let ok=false; try{ok=document.execCommand('copy');}catch(e){} document.body.removeChild(ta); ok?done():toast('No se pudo copiar. Selecciona el texto y usa Ctrl+C.'); };
  if(navigator.clipboard && window.isSecureContext){ navigator.clipboard.writeText(text).then(done,fallback); } else fallback();
}

/* ---------- Navegación (con historial) ---------- */
function go(view,opts){ Object.assign(state,{view},opts||{}); const h = view==='home'?'#inicio':'#'+state.ch+'/'+(state.sec+1)+(opts&&opts.focus?'/'+opts.focus:'');
  try{ if(location.hash!==h) history.pushState(null,'',h); }catch(err){ /* entorno sin historial (vista previa o iframe): se navega igual */ }
  render(opts&&opts.focus); }
function toTop(){ try{ window.scrollTo(0,0); }catch(err){} }
function render(focusId){ if(state.view==='home'){ renderHome(); toTop(); } else { renderChannel(focusId); if(!focusId) toTop(); } }
function fromHash(){
  let hash=''; try{ hash=location.hash||''; }catch(err){}
  const m=hash.match(/^#(voz|chat)\/(\d+)(?:\/(r\d+))?$/);
  if(m){ state.view='channel'; state.ch=m[1]; state.sec=Math.min(SECTIONS.length-1,Math.max(0,+m[2]-1)); if(m[3]) state.open.add(m[1]+m[3]); render(m[3]); }
  else { state.view='home'; render(); }
}
window.addEventListener('popstate',fromHash);

/* ---------- Eventos delegados ---------- */
document.getElementById('logoBtn').addEventListener('click',()=>{ state.homeQ=''; go('home'); });
app.addEventListener('click',e=>{
  const t=e.target.closest('button'); if(!t) return;
  if(t.dataset.go){ state.q=''; go('channel',{ch:t.dataset.go,sec:0}); return; }
  if(t.id==='goHome'){ state.homeQ=''; go('home'); return; }
  if(t.dataset.ch){ if(t.dataset.ch!==state.ch){ state.q=''; go('channel',{ch:t.dataset.ch}); } return; }
  if(t.dataset.sec!=null){ state.q=''; go('channel',{sec:+t.dataset.sec}); return; }
  if(t.dataset.open){ const [ch,sec,id]=t.dataset.open.split('|'); state.open.add(ch+id); state.q=''; go('channel',{ch,sec:+sec,focus:id}); return; }
  if(t.dataset.all){ const open=t.dataset.all==='open';
    app.querySelectorAll('.case').forEach(a=>{ const k=state.ch+a.dataset.id; open?state.open.add(k):state.open.delete(k); a.classList.toggle('open',open); a.querySelector('.case-h').setAttribute('aria-expanded',open); }); return; }
  if(t.classList.contains('case-h')){ const a=t.closest('.case'), k=state.ch+a.dataset.id, open=!a.classList.contains('open');
    a.classList.toggle('open',open); t.setAttribute('aria-expanded',open); open?state.open.add(k):state.open.delete(k); return; }
  if(t.dataset.copy){ const a=t.closest('.case'); const c=DATA.cases.find(x=>x.id===a.dataset.id); const d=c[state.ch];
    if(t.dataset.copy==='say') copyText(d.digo,'Speech');
    else if(t.dataset.copy==='do'){ if(d.hago) copyText(d.hago,'Procedimiento'); }
    else copyText('SECCIÓN: '+SECTIONS[c.sec]+'\nCASO O SITUACIÓN: '+c.caso+'\n\n¿QUÉ DIGO?\n'+d.digo+'\n\n¿QUÉ HAGO?\n'+(d.hago||'Sin indicación registrada en el protocolo para este caso.'),'Contenido completo');
  }
});
document.addEventListener('keydown',e=>{ if(e.key==='/' && !/input|textarea/i.test(document.activeElement.tagName)){ const i=document.getElementById(state.view==='home'?'homeQ':'chQ'); if(i){e.preventDefault();i.focus();} } });

fromHash();
})();
